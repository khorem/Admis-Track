<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Fiche Inscription Evenement</title>
  <link rel="stylesheet" href="styles.css"/>
  <script defer src="app.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      requireStudent();
      const eventId = getParam("event") || localStorage.getItem("selectedEventId");
      if(!eventId) go("student-events.html");

      const partId = getParam("part");
      let p = partId ? getParticipationById(partId) : getParticipationByEvent(eventId);
      if(!p){
        p = startParticipation(eventId);
      }

      document.querySelector("#evt").textContent = `${p.event.title} ? ${p.event.date} ? ${p.event.city}`;
      document.querySelector("#available").value = p.inscription.available || "oui";
      document.querySelector("#roleWanted").value = p.inscription.roleWanted || "Participant";
      document.querySelector("#motivation").value = p.inscription.motivation || "";

      // Resume profil (fige)
      document.querySelector("#prof").innerHTML = `
        <div class="kv">
          <div>Nom</div><div><b>${p.student.name}</b></div>
          <div>Email</div><div>${p.student.email}</div>
          <div>Formation</div><div>${p.student.formation} (${p.student.year})</div>
          <div>Campus</div><div>${p.student.campus}</div>
          <div>Telephone</div><div>${p.student.phone}</div>
        </div>
      `;
    });

    function saveAndSubmit(){
      const eventId = getParam("event") || localStorage.getItem("selectedEventId");
      const p = getParticipationByEvent(eventId) || getParticipationById(getParam("part"));
      if(!p) return go("student-events.html");

      p.inscription.available = document.querySelector("#available").value;
      p.inscription.roleWanted = document.querySelector("#roleWanted").value;
      p.inscription.motivation = document.querySelector("#motivation").value;

      // Dossier envoye e Admissions des cette etape
      p.status = "Soumis";
      upsertParticipation(p);

      go("student-confirmation.html?part=" + encodeURIComponent(p.id));
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <div class="h1">Inscription a un evenement</div>
          <div class="muted" id="evt"></div>
        </div>
      </div>
      <a class="btn ghost" href="student-events.html">Retour</a>
    </div>

    <div class="steps">
      <div class="step active">1. Inscription evenement</div>
      <div class="step">Presence</div>
      <div class="step">Defraiement</div>
    </div>

    <div class="grid grid-2" style="margin-top:14px">
      <div class="card">
        <h2>Profil (pre-rempli)</h2>
        <div class="muted">Ces informations viennent de votre fiche profil et ne sont pas à ressaisir.</div>
        <div class="hr"></div>
        <div id="prof"></div>
      </div>

      <div class="card">
        <h2>Choix pour l'événement</h2>

        <label>Disponible</label>
        <select id="available">
          <option value="oui">Oui</option>
          <option value="non">Non</option>
        </select>

        <label>Role souhaité</label>
        <select id="roleWanted">
          <option>Participant</option>
          <option>Ambassadeur</option>
        </select>

        <label>Motivation / Commentaire (facultatif)</label>
        <textarea id="motivation" rows="5" class="input" placeholder="Ex: Je suis à l'aise pour presenter ma formation..."></textarea>

        <div class="hr"></div>
        <button class="btn success" onclick="saveAndSubmit()">Envoyer le dossier e Admissions</button>
      </div>
    </div>
  </div>
</body>
</html>
