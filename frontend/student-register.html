<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Inscription etudiant - Profil</title>
  <link rel="stylesheet" href="styles.css"/>
  <script defer src="app.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", ()=>{
      const auth = loadJSON("studentAuth", null);
      if(!auth) go("login-student.html");

      const existing = loadJSON("studentProfile", null);
      if(existing && existing.email === auth.email){
        go("student-events.html");
        return;
      }
      document.querySelector("#email").value = auth.email || "";
    });

    function saveProfile(){
      const profile = {
        name: document.querySelector("#name").value.trim(),
        email: document.querySelector("#email").value.trim(),
        formation: document.querySelector("#formation").value.trim(),
        campus: document.querySelector("#campus").value.trim(),
        phone: document.querySelector("#phone").value.trim(),
        year: document.querySelector("#year").value.trim(),
        defaultRole: document.querySelector("#defaultRole").value,
        defaultTransport: document.querySelector("#defaultTransport").value,
        defaultDepartFrom: document.querySelector("#defaultDepartFrom").value.trim(),
      };

      if(!profile.name || !profile.email || !profile.formation || !profile.campus || !profile.phone || !profile.year){
        return alert("Veuillez remplir tous les champs obligatoires.");
      }
      if(!isValidEmail(profile.email)){
        return alert("Format email invalide.");
      }
      if(!isValidPhone(profile.phone)){
        return alert("Format telephone invalide.");
      }

      studentLogin(profile.email);
      studentRegister(profile);
      alert("Profil enregistre.");
      go("student-events.html");
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="brand-logos"><img class="logo-esiee" src="assets/logo-esiee.svg" alt="Logo ESIEE[it]"/><img class="logo-cf" src="assets/logo-coding-factory.svg" alt="Logo Coding Factory"/></div>
        <div>
          <div class="h1">Inscription etudiant (premiere fois)</div>
          <div class="muted">Saisissez vos informations sans champ pre-rempli.</div>
        </div>
      </div>
      <a class="btn ghost" href="index.html">Accueil</a>
    </div>

    <div class="card">
      <div class="grid grid-2">
        <div>
          <label>Nom et Prenom</label>
          <input class="input" id="name" placeholder="Ex: Awa Kone"/>
        </div>
        <div>
          <label>Email</label>
          <input class="input" id="email" placeholder="Ex: awa.kone@edu.esiee-it.fr"/>
        </div>
      </div>

      <div class="grid grid-2">
        <div>
          <label>Formation</label>
          <input class="input" id="formation" placeholder="Ex: Master ILMSI"/>
        </div>
        <div>
          <label>Annee d'etude</label>
          <input class="input" id="year" placeholder="Ex: 2eme annee"/>
        </div>
      </div>

      <div class="grid grid-2">
        <div>
          <label>Campus</label>
          <input class="input" id="campus" placeholder="Ex: Pontoise"/>
        </div>
        <div>
          <label>Telephone</label>
          <input class="input" id="phone" placeholder="Ex: 06 00 00 00 00"/>
        </div>
      </div>

      <div class="grid grid-2">
        <div>
          <label>Role par defaut</label>
          <select id="defaultRole">
            <option>Participant</option>
            <option>Ambassadeur</option>
          </select>
        </div>
        <div>
          <label>Transport par defaut</label>
          <select id="defaultTransport">
            <option>Transports</option>
            <option>Voiture</option>
            <option>Covoiturage</option>
          </select>
        </div>
      </div>

      <label>Point de depart par defaut (facultatif)</label>
      <input class="input" id="defaultDepartFrom" placeholder="Ex: Domicile / Campus"/>

      <div class="hr"></div>
      <button class="btn primary" onclick="saveProfile()">Enregistrer mon profil</button>
    </div>
  </div>
</body>
</html>
