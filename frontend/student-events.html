  <link rel="stylesheet" href="styles.css"/>

      renderEventsListGrouped("#events");

        <div>
          <div class="h1">Evenements disponibles</div>
          <div class="muted" id="who"></div>
        </div>
      </div>
      <div class="row">
        <a class="btn ghost" href="student-status.html">Suivi defraiements</a>
        <a class="btn ghost" href="index.html">Accueil</a>
      </div>
    </div>

</html>
