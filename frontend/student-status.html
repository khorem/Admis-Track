<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Suivi defraiements</title>
  <link rel="stylesheet" href="styles.css"/>
  <script defer src="app.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", async ()=>{
      const s = requireStudent();
      if(!s?.profile) return;
      try{
        const profile = await syncCurrentStudentProfile();
        await syncMyParticipations();
        document.querySelector("#who").textContent = `${profile.name} - ${profile.email}`;
        render();
      }catch(err){
        alert(err.message || "Erreur de chargement du suivi.");
      }
    });

    function render(){
      const s = loadJSON("studentProfile", null);
      const email = s?.email || "";
      const ps = getParticipations()
        .filter(p=>p.student.email===email)
        .sort((a,b)=> (a.event.date||"").localeCompare(b.event.date||""));

      const el = document.querySelector("#list");
      if(!ps.length){
        el.innerHTML = '<div class="muted">Aucun dossier pour le moment.</div>';
        return;
      }

      el.innerHTML = ps.map(p=>{
        const d = p.defraiement;
        const badgeKind = d.status==="Accepte" ? "ok" : (d.status==="Refuse" ? "bad" : (d.status==="En attente" ? "warn" : "pri"));
        return `
          <div class="card" style="margin-bottom:12px">
            <div class="row" style="justify-content:space-between;align-items:flex-start">
              <div>
                <h2 style="margin-bottom:6px">${p.event.title}</h2>
                <div class="muted">${p.event.type} - ${p.event.city} - ${p.event.date}</div>
                <div class="row" style="margin-top:10px;gap:8px">
                  <span class="badge pri">Dossier: ${p.status}</span>
                  <span class="badge">Role: ${p.inscription.roleWanted}</span>
                  <span class="badge ${badgeKind}">Defraiement: ${d.status}</span>
                </div>
                <div class="small" style="margin-top:8px">
                  Total calcule (cheque cadeau) : <b>${d.amountCalculated || "-"} EUR</b>
                  ${d.adminMessage ? ` - Retour admissions : <b>${d.adminMessage}</b>` : ""}
                </div>
              </div>
              <div class="row">
                <a class="btn ghost" href="student-presence.html?event=${encodeURIComponent(p.event.id)}">Ouvrir</a>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="brand-logos">
          <img class="logo-esiee" src="assets/logo-esiee.svg" alt="Logo ESIEE[it]"/>
          <img class="logo-cf" src="assets/logo-coding-factory.svg" alt="Logo Coding Factory"/>
        </div>
        <div>
          <div class="h1">Suivi des defraiements</div>
          <div class="muted" id="who"></div>
        </div>
      </div>
      <div class="row">
        <a class="btn ghost" href="student-events.html">Evenements</a>
        <a class="btn ghost" href="index.html">Accueil</a>
      </div>
    </div>

    <div id="list"></div>
  </div>
</body>
</html>
