<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin - Grande fiche</title>
  <link rel="stylesheet" href="styles.css"/>
  <script defer src="app.js"></script>
  <script>
    let P = null;

    window.addEventListener("DOMContentLoaded", () => {
      requireAdmin();
      const partId = getParam("part");
      P = partId ? getParticipationById(partId) : null;

      if(!P) {
        document.querySelector("#wrap").innerHTML = `<div class="card"><div class="muted">Aucun dossier a afficher.</div></div>`;
        return;
      }

      document.querySelector("#h").textContent = `Grande fiche - ${P.id}`;
      document.querySelector("#sub").textContent = `${P.event.title} - ${P.student.name} - Role: ${P.inscription.roleWanted}`;

      document.querySelector("#confirmed").value = P.internal.confirmedBySchool;
      document.querySelector("#managedBy").value = P.internal.managedBy;
      document.querySelector("#internalComment").value = P.internal.internalComment;
      document.querySelector("#amountValidated").value = P.internal.amountValidated;
      document.querySelector("#ccDonnes").value = P.internal.ccDonnes;

      document.querySelector("#defStatus").value = P.defraiement.status || "Non demande";
      document.querySelector("#defMsg").value = P.defraiement.adminMessage || "";

      document.querySelector("#summary").innerHTML = `
        <div class="kv">
          <div>Evenement</div><div><b>${P.event.title}</b> (${P.event.id})</div>
          <div>Type / Date</div><div>${P.event.type} - ${P.event.date}</div>
          <div>Ville / Lieu</div><div>${P.event.city} - ${P.event.location}</div>
          <div>Etudiant</div><div>${P.student.name} - ${P.student.email} - ${P.student.phone}</div>
          <div>Formation</div><div>${P.student.formation} (${P.student.year}) - Campus: ${P.student.campus}</div>
          <div>Inscription</div><div>Dispo: ${P.inscription.available} - Role: ${P.inscription.roleWanted}</div>
          <div>Presence</div><div>Present: ${P.presence.present} - ${P.presence.arrivedAt} -> ${P.presence.leftAt}</div>
          <div>Transport</div><div>${P.presence.transport} - Depart: ${P.presence.departFrom || "-"}</div>
          <div>Justificatif presence</div><div>${P.presence.justificatifName ? `<a href="${P.presence.justificatifDataUrl}" target="_blank">Voir (${P.presence.justificatifName})</a>` : "-"}</div>
          <div>Defraiement</div><div>Total calcule: <b>${P.defraiement.amountCalculated || "-"} EUR</b> (cheque cadeau) - Dejeuner salon: ${P.defraiement.lunchSalon || 0} EUR</div>
          <div>Justificatif defraiement</div><div>${P.defraiement.justificatifName ? `<a href="${P.defraiement.justificatifDataUrl}" target="_blank">Voir (${P.defraiement.justificatifName})</a>` : "- (facultatif)"}</div>
        </div>
      `;
    });

    function saveAll(){
      if(!P) return;

      P.internal.confirmedBySchool = document.querySelector("#confirmed").value;
      P.internal.managedBy = document.querySelector("#managedBy").value;
      P.internal.internalComment = document.querySelector("#internalComment").value;
      P.internal.amountValidated = document.querySelector("#amountValidated").value;
      P.internal.ccDonnes = document.querySelector("#ccDonnes").value;

      P.defraiement.status = document.querySelector("#defStatus").value;
      P.defraiement.adminMessage = document.querySelector("#defMsg").value;

      upsertParticipation(P);
      alert("Enregistre (prototype).");
      location.reload();
    }
  </script>
</head>
<body>
  <div class="container" id="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <div class="h1" id="h">Grande fiche</div>
          <div class="muted" id="sub"></div>
        </div>
      </div>
      <a class="btn ghost" href="admin-events.html"><- Retour</a>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h2>Resume dossier (donnees etudiant)</h2>
        <div id="summary"></div>
      </div>

      <div class="card">
        <h2>Admissions - Validation</h2>

        <label>Confirmé par l'école</label>
        <select id="confirmed">
          <option value="non">Non</option>
          <option value="oui">Oui</option>
        </select>

        <label>Action gerée par</label>
        <input class="input" id="managedBy" placeholder="Ex: Admissions"/>

        <label>Montant valide (EUR)</label>
        <input class="input" id="amountValidated" placeholder="Ex: 20"/>

        <label>Chèque cadeau donné ?</label>
        <select id="ccDonnes">
          <option value="non">Non</option>
          <option value="oui">Oui</option>
        </select>

        <label>Commentaire interne</label>
        <textarea id="internalComment" class="input" rows="3" placeholder="Notes internes..."></textarea>

        <div class="hr"></div>
        <h2>Retour defraiement (pour l'etudiant)</h2>

        <label>Statut defraiement</label>
        <select id="defStatus">
          <option>Non demande</option>
          <option>En attente</option>
          <option>Accepte</option>
          <option>Refuse</option>
        </select>

        <label>Message Admissions (visible étudiant)</label>
        <textarea id="defMsg" class="input" rows="3" placeholder="Ex: Accepte. Cheque cadeau disponible a l'accueil."></textarea>

        <div class="hr"></div>
        <button class="btn primary" onclick="saveAll()">Enregistrer</button>
      </div>
    </div>
  </div>
</body>
</html>
