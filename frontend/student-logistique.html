<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Fiche Logistique</title>
  <link rel="stylesheet" href="styles.css"/>
  <script defer src="app.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      requireStudent();
      const p = getParticipation(); if(!p) go("student-events.html");
      document.querySelector("#evt").textContent = `${p.event.title} • ${p.event.location}`;
      // preload
      document.querySelector("#departFrom").value = p.logistique.departFrom || "Domicile";
      document.querySelector("#departTime").value = p.logistique.departTime || "07:45";
      document.querySelector("#transport").value = p.logistique.transport || "Transports";
      document.querySelector("#notes").value = p.logistique.notes || "";
    });

    function saveAndNext(){
      const p = getParticipation();
      p.logistique.departFrom = document.querySelector("#departFrom").value;
      p.logistique.departTime = document.querySelector("#departTime").value;
      p.logistique.transport = document.querySelector("#transport").value;
      p.logistique.notes = document.querySelector("#notes").value;
      setParticipation(p);
      go("student-presence.html");
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <div class="h1">Fiche Logistique</div>
          <div class="muted" id="evt"></div>
        </div>
      </div>
      <a class="btn ghost" href="student-inscription.html">← Retour</a>
    </div>

    <div class="steps">
      <div class="step">1. Evènements</div>
      <div class="step">2. Inscription</div>
      <div class="step active">3. Logistique</div>
      <div class="step">4. Présence</div>
      <div class="step">5. Défraiement</div>
    </div>

    <div class="card" style="margin-top:14px">
      <label>Point de départ</label>
      <input class="input" id="departFrom" placeholder="Ex: Domicile / Campus"/>

      <label>Heure de départ estimée</label>
      <input class="input" id="departTime" placeholder="Ex: 07:45"/>

      <label>Moyen de transport prévu</label>
      <select id="transport">
        <option>Transports</option>
        <option>Voiture</option>
        <option>Covoiturage</option>
      </select>

      <label>Notes / besoins particuliers</label>
      <textarea id="notes" rows="4" class="input" placeholder="Ex: besoin d’un badge, repas..."></textarea>

      <div class="hr"></div>
      <button class="btn primary" onclick="saveAndNext()">Valider → Présence</button>
    </div>
  </div>
</body>
</html>
