<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Inscription Étudiant – Profil</title>
  <link rel="stylesheet" href="styles.css"/>
  <script defer src="app.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", ()=>{
      const auth = loadJSON("studentAuth", null);
      if(!auth) go("login-student.html");

      const existing = loadJSON("studentProfile", null);
      if(existing && existing.email === auth.email){
        // profil déjà créé
        go("student-events.html");
        return;
      }
      document.querySelector("#email").value = auth.email || "";
    });

    function saveProfile(){
      const profile = {
        name: document.querySelector("#name").value.trim(),
        email: document.querySelector("#email").value.trim(),
        formation: document.querySelector("#formation").value.trim(),
        campus: document.querySelector("#campus").value.trim(),
        phone: document.querySelector("#phone").value.trim(),
        year: document.querySelector("#year").value.trim(),
        defaultRole: document.querySelector("#defaultRole").value,
        defaultTransport: document.querySelector("#defaultTransport").value,
        defaultDepartFrom: document.querySelector("#defaultDepartFrom").value.trim(),
      };

      if(!profile.name || !profile.email || !profile.formation || !profile.campus || !profile.phone || !profile.year){
        return alert("Veuillez remplir tous les champs obligatoires.");
      }

      // Keep auth aligned if user updates email on first registration.
      studentLogin(profile.email);
      studentRegister(profile);
      alert("Profil enregistré (prototype).");
      go("student-events.html");
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <div class="h1">Inscription Étudiant (1ère fois)</div>
          <div class="muted">Fiche profil – ces informations seront conservées et réutilisées</div>
        </div>
      </div>
      <a class="btn ghost" href="index.html">Accueil</a>
    </div>

    <div class="card">
      <div class="grid grid-2">
        <div>
          <label>Nom & Prénom</label>
          <input class="input" id="name" placeholder="Ex: Awa Koné" value="Awa Koné"/>
        </div>
        <div>
          <label>Email</label>
          <input class="input" id="email" placeholder="Ex: awa.kone@edu.esiee-it.fr"/>
        </div>
      </div>

      <div class="grid grid-2">
        <div>
          <label>Formation</label>
          <input class="input" id="formation" placeholder="Ex: Master ILMSI" value="Master ILMSI"/>
        </div>
        <div>
          <label>Année (ex: 2ème année)</label>
          <input class="input" id="year" placeholder="Ex: 2ème année" value="2ème année"/>
        </div>
      </div>

      <div class="grid grid-2">
        <div>
          <label>Campus</label>
          <input class="input" id="campus" placeholder="Ex: Pontoise" value="Pontoise"/>
        </div>
        <div>
          <label>Téléphone</label>
          <input class="input" id="phone" placeholder="Ex: 06 00 00 00 00" value="06 00 00 00 00"/>
        </div>
      </div>

      <div class="grid grid-2">
        <div>
          <label>Rôle par défaut</label>
          <select id="defaultRole">
            <option>Participant</option>
            <option>Ambassadeur</option>
          </select>
        </div>
        <div>
          <label>Transport par défaut</label>
          <select id="defaultTransport">
            <option>Transports</option>
            <option>Voiture</option>
            <option>Covoiturage</option>
          </select>
        </div>
      </div>

      <label>Point de départ par défaut (facultatif)</label>
      <input class="input" id="defaultDepartFrom" placeholder="Ex: Domicile / Campus"/>

      <div class="hr"></div>
      <button class="btn primary" onclick="saveProfile()">Enregistrer mon profil → Accéder aux évènements</button>
    </div>
  </div>
</body>
</html>
