<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Présence</title>
  <link rel="stylesheet" href="styles.css"/>
  <script defer src="app.js"></script>
  <script>
    let CURRENT_P = null;

    window.addEventListener("DOMContentLoaded", () => {
      requireStudent();
      const eventId = getParam("event") || localStorage.getItem("selectedEventId");
      if(!eventId) go("student-events.html");

      CURRENT_P = getParticipationByEvent(eventId);
      if(!CURRENT_P) go("student-events.html");

      document.querySelector("#evt").textContent = `${CURRENT_P.event.title} ? ${CURRENT_P.event.date}`;
      document.querySelector("#arrivedAt").value = CURRENT_P.presence.arrivedAt || "09:00";
      document.querySelector("#leftAt").value = CURRENT_P.presence.leftAt || "17:00";
      document.querySelector("#present").value = CURRENT_P.presence.present || "non";
      document.querySelector("#transport").value = CURRENT_P.presence.transport || "Transports";
      document.querySelector("#departFrom").value = CURRENT_P.presence.departFrom || "";

      const unlocked = isUnlockedByDate(CURRENT_P.event.date);
      document.querySelector("#lock").style.display = unlocked ? "none" : "block";
      document.querySelector("#form").style.display = unlocked ? "block" : "none";
      document.querySelector("#gotoDef").href = `student-defraiement.html?event=${encodeURIComponent(CURRENT_P.event.id)}`;

      toggleJustif();
    });

    function toggleJustif(){
      const present = document.querySelector("#present").value;
      const box = document.querySelector("#justifBox");
      box.style.display = (present === "oui") ? "block" : "none";
    }

    function savePresence(next=false){
      if(!CURRENT_P) return;

      const present = document.querySelector("#present").value;
      const arrivedAt = document.querySelector("#arrivedAt").value;
      const leftAt = document.querySelector("#leftAt").value;
      const transport = document.querySelector("#transport").value;
      const departFrom = document.querySelector("#departFrom").value;

      // justificatif obligatoire si present = oui
      const file = document.querySelector("#justif").files[0];

      if(present === "oui" && !file && !CURRENT_P.presence.justificatifDataUrl){
        return alert("Justificatif obligatoire si vous etes present (photo / fichier).");
      }

      CURRENT_P.presence.present = present;
      CURRENT_P.presence.arrivedAt = arrivedAt;
      CURRENT_P.presence.leftAt = leftAt;
      CURRENT_P.presence.transport = transport;
      CURRENT_P.presence.departFrom = departFrom;

      if(file){
        fileToDataUrl(file, ({name, dataUrl})=>{
          CURRENT_P.presence.justificatifName = name;
          CURRENT_P.presence.justificatifDataUrl = dataUrl;
          CURRENT_P.status = "Presence renseignee";
          upsertParticipation(CURRENT_P);
          alert("Presence enregistree (prototype).");
          if(next) go(`student-defraiement.html?event=${encodeURIComponent(CURRENT_P.event.id)}`);
        });
      }else{
        CURRENT_P.status = "Presence renseignee";
        upsertParticipation(CURRENT_P);
        alert("Presence enregistree (prototype).");
        if(next) go(`student-defraiement.html?event=${encodeURIComponent(CURRENT_P.event.id)}`);
      }
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <div class="h1">Présence</div>
          <div class="muted" id="evt"></div>
        </div>
      </div>
      <a class="btn ghost" href="student-events.html">Retour</a>
    </div>

    <div class="steps">
      <div class="step">1. Inscription evenement</div>
      <div class="step active">2.Présence</div>
      <div class="step">3.Defraiement</div>
    </div>

    <div class="note" id="lock" style="margin-top:14px;display:none">
      Cet ecran est debloque <b>à partir de la date de l'évenement</b>.
      Vous avez déjà pu transmettre votre dossier à l'Admissions via la fiche d'inscription.
    </div>

    <div class="card" id="form" style="margin-top:14px;display:none">
      <div class="grid grid-2">
        <div>
          <label>Heure d'arrivée</label>
          <input class="input" id="arrivedAt" placeholder="Ex: 09:00"/>
        </div>
        <div>
          <label>Heure de depart</label>
          <input class="input" id="leftAt" placeholder="Ex: 17:00"/>
        </div>
      </div>

      <label>Présent</label>
      <select id="present" onchange="toggleJustif()">
        <option value="oui">Oui</option>
        <option value="non">Non</option>
      </select>

      <div class="grid grid-2">
        <div>
          <label>Moyen de transport</label>
          <select id="transport">
            <option>Transports</option>
            <option>Voiture</option>
            <option>Covoiturage</option>
          </select>
        </div>
        <div>
          <label>Point de départ prevu</label>
          <input class="input" id="departFrom" placeholder="Ex: Domicile / Campus"/>
        </div>
      </div>

      <div id="justifBox" style="display:none">
        <label>Justificatif de présence (obligatoire si Présent = Oui)</label>
        <input class="input" type="file" id="justif" accept="image/*,.pdf"/>
        <!-- <div class="small">Prototype : le fichier est stocke localement (base64).</div> -->
      </div>

      <div class="hr"></div>
      <div class="row">
        <button class="btn primary" onclick="savePresence(false)">Enregistrer</button>
        <button class="btn success" onclick="savePresence(true)">Enregistrer Defraiement</button>
        <a class="btn ghost" id="gotoDef" href="#">Aller au defraiement</a>
      </div>
    </div>
  </div>
</body>
</html>
