<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin Creation / Modification Evenement</title>
  <link rel="stylesheet" href="styles.css"/>
  <script defer src="app.js"></script>
  <script>
    let MODE = "create";
    let EVT_ID = null;

    window.addEventListener("DOMContentLoaded", ()=>{
      requireAdmin();
      MODE = getParam("mode") || "create";
      EVT_ID = getParam("event");

      if(MODE === "edit" && EVT_ID){
        const e = findEvent(EVT_ID);
        if(!e) return go("admin-events.html");
        document.querySelector("#h").textContent = "Modifier un evenement";
        document.querySelector("#id").textContent = e.id;
        document.querySelector("#type").value = e.type;
        document.querySelector("#title").value = e.title;
        document.querySelector("#date").value = e.date;
        document.querySelector("#city").value = e.city;
        document.querySelector("#location").value = e.location;
        document.querySelector("#hours").value = e.hours;
        document.querySelector("#need").value = e.need;
        document.querySelector("#cname").value = e.contact?.name || "";
        document.querySelector("#cemail").value = e.contact?.email || "";
        document.querySelector("#cphone").value = e.contact?.phone || "";
        document.querySelector("#desc").value = e.description || "";
      }else{
        document.querySelector("#h").textContent = "Creer un evenement";
        document.querySelector("#id").textContent = "(auto)";
        document.querySelector("#date").value = todayISO();
      }
    });

    function saveEvent(){
      const events = getEvents();
      const data = {
        id: EVT_ID,
        type: document.querySelector("#type").value,
        title: document.querySelector("#title").value.trim(),
        date: document.querySelector("#date").value,
        city: document.querySelector("#city").value.trim(),
        location: document.querySelector("#location").value.trim(),
        hours: document.querySelector("#hours").value.trim(),
        need: parseInt(document.querySelector("#need").value || "0",10) || 0,
        contact: {
          name: document.querySelector("#cname").value.trim(),
          email: document.querySelector("#cemail").value.trim(),
          phone: document.querySelector("#cphone").value.trim(),
        },
        description: document.querySelector("#desc").value.trim(),
      };

      if(!data.type || !data.title || !data.date || !data.city) return alert("Veuillez remplir au minimum : Type, Titre, Date, Ville.");

      if(MODE === "create"){
        data.id = nextEventId(events);
        events.push(data);
        setEvents(events);
        alert("Evenement cree (prototype).");
      }else{
        const idx = events.findIndex(x=>x.id===EVT_ID);
        if(idx<0) return go("admin-events.html");
        events[idx] = data;
        setEvents(events);
        alert("Evenement modifie (prototype).");
      }
      go("admin-events.html");
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <div class="h1" id="h"></div>
          <div class="muted">ID : <span id="id"></span></div>
        </div>
      </div>
      <a class="btn ghost" href="admin-events.html">Retour</a>
    </div>

    <div class="card">
      <div class="grid grid-2">
        <div>
          <label>Type d'évènement</label>
          <select id="type">
            <option>Forum</option>
            <option>Salon</option>
            <option>JPO</option>
            <option>Intervention</option>
            <option>évenement école</option>
            <option>Atelier</option>
          </select>
        </div>
        <div>
          <label>Titre</label>
          <input class="input" id="title" placeholder="Ex: Salon de l'étudiant - Paris"/>
        </div>
      </div>

      <div class="grid grid-2">
        <div>
          <label>Date</label>
          <input class="input" id="date" type="date"/>
        </div>
        <div>
          <label>Horaires</label>
          <input class="input" id="hours" placeholder="Ex: 09:00 - 17:00"/>
        </div>
      </div>

      <div class="grid grid-2">
        <div>
          <label>Ville</label>
          <input class="input" id="city" placeholder="Ex: Paris"/>
        </div>
        <div>
          <label>Lieu</label>
          <input class="input" id="location" placeholder="Ex: Porte de Versailles"/>
        </div>
      </div>

      <div class="grid grid-2">
        <div>
          <label>Besoin (nb etudiants)</label>
          <input class="input" id="need" type="number" min="0" placeholder="Ex: 4"/>
        </div>
        <div>
          <label>Contact sur place</label>
          <input class="input" id="cname" placeholder="Nom du contact"/>
        </div>
      </div>

      <div class="grid grid-2">
        <div>
          <label>Email contact</label>
          <input class="input" id="cemail" placeholder="contact@ecole.fr"/>
        </div>
        <div>
          <label>Telephone contact</label>
          <input class="input" id="cphone" placeholder="01 23 45 67 89"/>
        </div>
      </div>

      <label>Description</label>
      <textarea id="desc" rows="4" class="input" placeholder="Description / mission attendue..."></textarea>

      <div class="hr"></div>
      <button class="btn primary" onclick="saveEvent()">Enregistrer</button>
    </div>
  </div>
</body>
</html>
